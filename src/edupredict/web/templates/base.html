<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --line: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
           font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.55; }
    .wrap { max-width: 60rem; margin: 0 auto; }
    h1 { margin: 0 0 .25rem; font-size: 1.9rem; letter-spacing: -.02em; }
    h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .08em;
         color: var(--muted); margin: 2rem 0 .75rem; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; }
    .panel { background: var(--panel); border: 1px solid var(--line);
             border-radius: .6rem; padding: 1rem 1.15rem; margin-bottom: 1rem; }
    .row { display: flex; justify-content: space-between; align-items: baseline;
           gap: 1rem; flex-wrap: wrap; }
    .badge { font-size: .75rem; font-weight: 700; text-transform: uppercase;
             letter-spacing: .06em; padding: .2rem .55rem; border-radius: 999px;
             border: 1px solid currentColor; }
    .s-ok { color: var(--ok); } .s-warn { color: var(--warn); }
    .s-unavailable, .s-error { color: var(--bad); }
    .detail { color: var(--muted); font-size: .9rem; margin: .5rem 0 0; }
    code { background: #0b1220; border: 1px solid var(--line); border-radius: .3rem;
           padding: .1rem .35rem; font-size: .85rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0;
         border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    footer { color: var(--muted); font-size: .8rem; margin-top: 2rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
